<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garmin Coach</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c2330; --muted:#667085; --line:#e4e7ec; --accent:#2563eb;
          --ok:#16a34a; --warn:#d97706; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161d; --card:#1b212b; --text:#e8ecf2; --muted:#98a2b3; --line:#2b3340; --accent:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,sans-serif; }
  header { padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
  header h1 { font-size:1.1em; margin:0; }
  nav { display:flex; gap:4px; padding:0 12px; overflow-x:auto; border-bottom:1px solid var(--line); }
  nav button { background:none; border:0; padding:10px 12px; font:inherit; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; }
  nav button.on { color:var(--text); border-color:var(--accent); font-weight:600; }
  main { max-width:900px; margin:0 auto; padding:12px 16px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:12px 0; }
  .card { overflow-x:auto; }
  .card h2, .card h3 { margin:0 0 6px; font-size:1.05em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .big { font-size:1.9em; font-weight:700; line-height:1.1; }
  .muted { color:var(--muted); font-size:.9em; }
  .chip { display:inline-block; padding:1px 9px; border-radius:99px; font-size:.8em; font-weight:600; color:#fff; background:var(--muted); }
  .chip.bien, .chip.suave, .chip.seguir, .chip.descanso { background:var(--ok); }
  .chip.atencion, .chip.moderada, .chip.modificar { background:var(--warn); }
  .chip.mal, .chip.fuerte, .chip.sustituir { background:var(--bad); }
  table { border-collapse:collapse; width:100%; font-size:.92em; }
  td, th { border-bottom:1px solid var(--line); padding:6px 4px; text-align:left; vertical-align:top; }
  input, textarea, button.btn, select { font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  textarea { width:100%; min-height:90px; }
  button.btn { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  button.btn:disabled { opacity:.5; }
  ol.steps { padding-left:20px; margin:6px 0; }
  ul { padding-left:20px; margin:6px 0; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  svg text { fill:var(--muted); font-size:10px; }
  .hide { display:none; }
  label { display:block; margin:10px 0 2px; font-weight:600; }
</style>
</head>
<body>
<div id="login" class="hide" style="max-width:320px;margin:40px auto;padding:0 16px">
  <h1>Garmin Coach</h1>
  <input id="pass" type="password" placeholder="contraseña" style="width:100%">
  <p><button class="btn" onclick="signIn()">Entrar</button> <span id="msg" class="muted"></span></p>
</div>

<div id="app" class="hide">
  <header>
    <h1 id="goal">Garmin Coach</h1>
    <div class="row"><span id="status" class="muted"></span>
      <button class="btn" id="refresh" onclick="refresh()">Actualizar ahora</button>
      <button class="btn" style="background:var(--muted)" onclick="signOut()">Salir</button></div>
  </header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (x, d = 0) => (x === null || x === undefined || x === "" ? "—" : (typeof x === "number" ? x.toFixed(d) : esc(x)));
const TABS = [["hoy","Hoy"],["estado","Estado"],["semana","Semana"],["analisis","Análisis"],["metricas","Métricas"],["registro","Registro"],["ajustes","Ajustes"]];
let D = null, tab = localStorage.getItem("tab") || "hoy", poll = null;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
  if (r.status === 401) { D = null; show(); throw new Error("401"); }
  return r.json();
}
async function signIn() {
  const r = await fetch("/api/login", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ password: $("pass").value }) });
  if (r.ok) load(); else $("msg").textContent = "Contraseña incorrecta";
}
async function signOut() { await fetch("/api/logout", { method:"POST" }); D = null; show(); }

async function load() {
  const r = await fetch("/api/data");
  if (!r.ok) { D = null; return show(); }
  D = await r.json();
  show();
  if (D.refreshing && !poll) poll = setInterval(load, 5000);
  if (!D.refreshing && poll) { clearInterval(poll); poll = null; }
}
async function refresh() { await api("/api/refresh", {}); load(); }
function setTab(t) { tab = t; localStorage.setItem("tab", t); show(); }

function show() {
  $("login").classList.toggle("hide", !!D);
  $("app").classList.toggle("hide", !D);
  if (!D) return;
  $("goal").textContent = D.settings.goal_name + (D.days_left !== null ? ` · faltan ${D.days_left} días (${Math.floor(D.days_left/7)} semanas)` : "");
  $("status").textContent = D.refreshing ? "Actualizando… (~1 min)" : (D.reco ? "Última recomendación: " + D.reco.day : "");
  $("refresh").disabled = D.refreshing;
  $("tabs").innerHTML = TABS.map(([k, n]) => `<button class="${k===tab?"on":""}" onclick="setTab('${k}')">${n}</button>`).join("");
  $("view").innerHTML = ({hoy, estado, semana, analisis, metricas, registro, ajustes})[tab]();
}

const chip = (v) => v ? `<span class="chip ${esc(String(v).toLowerCase())}">${esc(v)}</span>` : "";
const last = (k) => { for (let i = D.metrics.length - 1; i >= 0; i--) if (D.metrics[i][k] != null) return D.metrics[i]; return {}; };

/* ---------- gráficas SVG ---------- */
function spark(vals, opt = {}) {
  const pts = vals.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (pts.length < 2) return '<div class="muted">sin datos</div>';
  const W = 220, H = 50, P = 4;
  let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  if (opt.band) { lo = Math.min(lo, opt.band[0]); hi = Math.max(hi, opt.band[1]); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const x = i => P + i * (W - 2 * P) / (vals.length - 1), y = v => H - P - (v - lo) * (H - 2 * P) / (hi - lo);
  const band = opt.band ? `<rect x="0" y="${y(opt.band[1])}" width="${W}" height="${y(opt.band[0]) - y(opt.band[1])}" fill="var(--ok)" opacity=".15"/>` : "";
  const path = pts.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" ");
  const lp = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${band}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${x(lp[0])}" cy="${y(lp[1])}" r="3" fill="var(--accent)"/></svg>`;
}
function bars(rows, key, unit) {
  const max = Math.max(1, ...rows.map(r => r[key]));
  const W = 440, H = 120, bw = W / rows.length;
  return `<svg viewBox="0 0 ${W} ${H + 16}" width="100%">` + rows.map((r, i) => {
    const h = r[key] / max * (H - 14);
    return `<rect x="${i*bw+3}" y="${H-h}" width="${bw-6}" height="${h}" fill="var(--accent)" rx="2"/>` +
      `<text x="${i*bw+bw/2}" y="${H-h-3}" text-anchor="middle">${Math.round(r[key])}</text>` +
      `<text x="${i*bw+bw/2}" y="${H+12}" text-anchor="middle">${r.week.slice(5)}</text>`;
  }).join("") + `</svg>`;
}

/* ---------- pestañas ---------- */
function hoy() {
  const r = D.reco;
  if (!r) return `<div class="card">Aún no hay recomendación. Pulsa <b>Actualizar ahora</b> (tarda ~1 minuto).</div>`;
  const t = r.today || {}, g = t.garmin_coach || {};
  const m = D.metrics[D.metrics.length - 1] || {};
  const tgt = o => !o || !o.tipo || o.tipo === "ninguno" ? "" : o.tipo === "fc" ? (o.min ? ` · FC ${num(o.min)}–${num(o.max)}` : ` · FC < ${num(o.max)}`) : ` · ritmo ${esc(o.min)}–${esc(o.max)}/km`;
  const dur = p => p.duracion_min ? ` · ${p.duracion_min} min` : p.distancia_m ? ` · ${p.distancia_m} m` : p.distancia_km ? ` · ${p.distancia_km} km` : "";
  const one = p => p.pasos && p.repeticiones ? `<li><b>${p.repeticiones} ×</b><ol class="steps">${p.pasos.map(one).join("")}</ol></li>`
      : `<li><b>${esc(p.nombre)}</b>${dur(p)}${tgt(p.objetivo)}<div class="muted">${esc(p.detalle)}</div></li>`;
  const steps = (t.pasos || []).map(one).join("");
  const sent = D.sent && D.sent[D.today];
  const canSend = ["running", "carrera", "correr", "run"].includes(String(t.tipo || "").toLowerCase());
  return `
  <div class="card"><div class="muted">${esc(r.day)} · fase: ${esc(r.fase)}</div><p style="margin:6px 0 0">${esc(r.resumen)}</p></div>
  <div class="card">
    <div class="row"><h2 style="margin:0">${esc(t.titulo)}</h2> ${chip(t.intensidad)}</div>
    <div class="muted">${esc(t.tipo)} · ${num(t.duracion_min)} min${t.distancia_km ? " · " + num(t.distancia_km, 1) + " km" : ""}</div>
    <ol class="steps">${steps}</ol>
    <div><b>Por qué:</b> ${esc(t.motivo)}</div>
    ${canSend ? `<p class="row"><button class="btn" onclick="sendWorkout()">${sent ? "Reenviar a mi Garmin" : "Enviar a mi Garmin"}</button>
      <a href="#" onclick="previewWorkout();return false" class="muted">ver JSON</a> <span id="sendmsg" class="muted">${sent ? "Enviado: " + esc(sent.name) : ""}</span></p>` : ""}
  </div>
  <div class="card"><h3>Contraste con Garmin Coach ${chip(g.decision)}</h3>
    <div class="muted">Programado en Garmin hoy: ${D.calendar.filter(c => c.date === D.today).map(c => esc(c.title) + (c.desc ? " (" + esc(c.desc) + ")" : "") + (c.min ? " " + c.min + " min" : "")).join(" + ") || esc(g.planificado)}</div><div>${esc(g.comentario)}</div></div>
  <div class="grid">
    <div class="card"><div class="muted">Readiness</div><div class="big">${num(m.readiness)}</div><div class="muted">${esc(m.readiness_level)}</div></div>
    <div class="card"><div class="muted">HRV anoche (ms)</div><div class="big">${num(m.hrv)}</div><div class="muted">media 7d ${num(m.hrv_weekly)} · ${esc(m.hrv_status)}</div></div>
    <div class="card"><div class="muted">Sueño</div><div class="big">${num(m.sleep_h, 1)} h</div><div class="muted">puntuación ${num(m.sleep_score)}</div></div>
    <div class="card"><div class="muted">Body Battery</div><div class="big">${num(m.bb_high)}</div><div class="muted">mín ${num(m.bb_low)}</div></div>
  </div>
  ${(r.preguntas || []).length ? `<div class="card"><h3>El coach necesita saber</h3><ul>${r.preguntas.map(q => `<li>${esc(q)}</li>`).join("")}</ul><div class="muted">Respóndelo abajo como nota y se tendrá en cuenta.</div></div>` : ""}
  <div class="card"><h3>¿Cómo te sientes / cómo fue el entreno?</h3>
    <textarea id="note" placeholder="Se tendrá en cuenta en la próxima recomendación"></textarea>
    <p><button class="btn" onclick="addNote()">Guardar nota</button></p></div>`;
}


const pace = p => p ? Math.floor(p) + ":" + String(Math.round((p % 1) * 60) % 60).padStart(2, "0") : "—";
const delta = (a, b, inv) => (a == null || b == null) ? "" : `<span style="color:var(--${(inv ? a < b : a > b) ? "ok" : "warn"})">${a > b ? "▲" : a < b ? "▼" : "="} ${Math.abs(a - b).toFixed(1)}</span>`;

function estado() {
  const E = D.estado, X = (D.reco && D.reco.estado) || {}, est = X.estimaciones || {};
  const kpi = (t, v, sub) => `<div class="card"><div class="muted">${t}</div><div class="big">${v}</div><div class="muted">${sub || ""}</div></div>`;
  const v = E.vo2max, vol = E.volumen, hrv = E.hrv, c = E.carga;
  const Z = E.zonas;
  const zon = Z ? `<div class="card"><h3>Ritmos reales por zona de FC</h3><div class="muted">Zonas de ${Z.fuente === "garmin" ? "Garmin" : "tus ajustes"}${Z.fc_max ? " (FC máx " + num(Z.fc_max) + ")" : ""}. Mediana de tus carreras de ≥3 km, últimos 28 días frente a los 28 anteriores (min/km).</div>
    <table><tr><th>Zona</th><th>FC</th><th>Ritmo</th><th>Antes</th><th>Cambio</th><th>Sesiones</th></tr>${Z.zonas.map(z => `<tr><td>${esc(z.zona)}</td><td>${esc(z.fc)}</td><td><b>${pace(z.pace)}</b></td><td>${pace(z.pace_prev)}</td>
    <td>${z.pace && z.pace_prev ? (d => `<span style="color:var(--${d > 0 ? "ok" : "warn"})">${d > 0 ? "−" : "+"}${Math.abs(d)} s/km</span>`)(Math.round((z.pace_prev - z.pace) * 60)) : ""}</td><td>${z.n} <span class="muted">(antes ${z.n_prev})</span></td></tr>`).join("")}</table></div>`
    : `<div class="card muted">Para ver tus ritmos por zona, indica tus zonas de FC en <b>Ajustes</b>.</div>`;
  const objetivos = (X.ritmos_objetivo || []).length ? `<div class="card"><h3>Ritmos objetivo (coach)</h3><table>${X.ritmos_objetivo.map(r => `<tr><td>${esc(r.zona)}</td><td><b>${esc(r.ritmo)}</b></td><td>${esc(r.uso)}</td></tr>`).join("")}</table></div>` : "";
  const estim = Object.keys(est).length ? `<div class="card"><h3>Estimaciones del coach <span class="chip ${est.confianza === "alta" ? "bien" : est.confianza === "media" ? "atencion" : ""}">${esc(est.confianza)}</span></h3>
    <div class="muted">Son orientativas, no un resultado de carrera.</div>
    <table><tr><td>VO2max</td><td>${esc(est.vo2max)}</td></tr><tr><td>Maratón</td><td><b>${esc(est.maraton_tiempo)}</b> (${esc(est.maraton_ritmo)})</td></tr>
    <tr><td>Media maratón</td><td>${esc(est.media_tiempo)}</td></tr><tr><td>10K</td><td>${esc(est["10k_tiempo"])}</td></tr><tr><td>5K</td><td>${esc(est["5k_tiempo"])}</td></tr></table>
    <div class="muted" style="margin-top:6px">Base: ${esc(est.base)}</div></div>` : "";
  const gp = E.prediccion_garmin ? Object.entries(Array.isArray(E.prediccion_garmin) ? (E.prediccion_garmin[0] || {}) : E.prediccion_garmin).filter(([k, x]) => /time/i.test(k) && typeof x === "number")
    .map(([k, x]) => `${esc(k.replace(/Time$/i, ""))}: ${Math.floor(x/3600)}:${String(Math.floor(x%3600/60)).padStart(2,"0")}:${String(Math.round(x%60)).padStart(2,"0")}`).join(" · ") : "";
  return `
  ${X.resumen ? `<div class="card"><h3>Overview</h3>${esc(X.resumen)}</div>` : ""}
  <div class="grid">
    ${kpi("VO2max (Garmin)", num(v.actual, 1), "hace 30 d: " + num(v.hace_30d, 1) + " " + delta(v.actual, v.hace_30d) + " · 60 d: " + num(v.hace_60d, 1))}
    ${kpi("Km últimas 2 semanas", num(vol.km_14d, 1), `previas: ${num(vol.km_14d_previos, 1)} · ${vol.cambio_pct == null ? "—" : (vol.cambio_pct > 0 ? "+" : "") + vol.cambio_pct + "%"} ${vol.alerta_10pct ? '<span class="chip atencion">&gt;10%</span>' : ""}`)}
    ${kpi("FC en reposo (7 d)", num(E.rhr.ult7, 1), "21 d previos: " + num(E.rhr.prev21, 1) + " " + delta(E.rhr.ult7, E.rhr.prev21, true))}
    ${kpi("HRV (7 d)", num(hrv.ult7, 0), `rango ${num(hrv.rango[0])}–${num(hrv.rango[1])} · ${esc(hrv.estado)}`)}
    ${kpi("Sueño (7 d)", num(E.sueno.ult7, 1) + " h", "21 d previos: " + num(E.sueno.prev21, 1))}
    ${kpi("Carga aguda/crónica", num(c.aguda) + " / " + num(c.cronica), `ratio ${num(c.acwr, 1)} · ${esc(c.estado)}`)}
    ${kpi("Tirada más larga (28 d)", E.largo_28d ? num(E.largo_28d.km, 1) + " km" : "—", E.largo_28d ? `${num(E.largo_28d.min)} min · FC ${num(E.largo_28d.fc)} · ${esc(E.largo_28d.dia)}` : "")}
    ${kpi("Días sin correr", num(E.dias_sin_correr), "fuerza últimas 2 semanas: " + E.fuerza_14d + " sesiones")}
    ${kpi("Plan Garmin (14 d)", E.plan_14d.hechas + " / " + E.plan_14d.programadas, "sesiones hechas")}
  </div>
  ${zon}${objetivos}${estim}
  ${gp ? `<div class="card"><h3>Predicciones de Garmin (referencia)</h3>${gp}</div>` : ""}
  ${(X.recomendaciones_generales || []).length ? `<div class="card"><h3>Recomendaciones generales</h3><ul>${X.recomendaciones_generales.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>` : '<div class="card muted">Las estimaciones y recomendaciones generales aparecen tras pulsar <b>Actualizar ahora</b>.</div>'}`;
}

function semana() {
  const r = D.reco;
  const up = r ? (r.upcoming || []).map(u => `<tr><td>${esc(u.day)}</td><td><b>${esc(u.titulo)}</b><div class="muted">${esc(u.notas)}</div></td>
     <td>${esc(u.tipo)}</td><td>${num(u.duracion_min)} min${u.distancia_km ? "<br>" + num(u.distancia_km, 1) + " km" : ""}</td><td>${chip(u.intensidad)}</td></tr>`).join("") : "";
  const st = { COMPLETE: "hecho", NOT_COMPLETE: "", SKIPPED: "saltado" };
  const cal = D.calendar.map(c => `<tr${c.date === D.today ? ' style="font-weight:600"' : ""}><td>${esc(c.date)}</td>
     <td>${esc(c.title)}${c.long ? " ⟶" : ""}<div class="muted">${esc(c.desc)}</div></td><td>${esc(c.sport)}</td>
     <td>${c.min ? num(c.min) + " min" : ""}</td><td>${esc(st[c.status] ?? c.status ?? "")}</td></tr>`).join("");
  const pi = D.plan && D.plan.nombre ? `<div class="muted">${esc(D.plan.nombre)} · ${esc(D.plan.inicio)} → ${esc(D.plan.fin)} · ${esc(D.plan.semanas)} semanas</div>` : "";
  return `<div class="card"><h2>Próximos 7 días (recomendado)</h2><table><tr><th>Día</th><th>Entreno</th><th>Tipo</th><th>Volumen</th><th>Intensidad</th></tr>${up || '<tr><td colspan=5>Sin datos</td></tr>'}</table></div>
  <div class="card"><h2>Plan de Garmin Coach</h2>${pi}<table><tr><th>Día</th><th>Entreno</th><th>Deporte</th><th>Duración</th><th>Estado</th></tr>${cal || '<tr><td colspan=5 class="muted">Nada programado o no se pudo leer.</td></tr>'}</table></div>`;
}

function analisis() {
  const a = D.reco && D.reco.analisis;
  if (!a) return `<div class="card">Sin análisis todavía.</div>`;
  const sec = (k, t) => a[k] ? `<div class="card"><h3>${t} ${chip(a[k].estado)}</h3><div>${esc(a[k].texto)}</div></div>` : "";
  const list = (k, t) => (a[k] || []).length ? `<div class="card"><h3>${t}</h3><ul>${a[k].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  return sec("recuperacion","Recuperación") + sec("sueno","Sueño") + sec("hrv","HRV") + sec("carga","Carga de entrenamiento") +
         sec("semana","Semana en curso") + sec("progreso_objetivo","Progreso hacia el objetivo") + list("riesgos","Riesgos") + list("recomendaciones","Recomendaciones");
}

function metricas() {
  const M = D.metrics, col = k => M.map(m => m[k]);
  const L = M[M.length - 1] || {};
  const card = (t, k, d = 0, opt = {}) => `<div class="card"><div class="muted">${t}</div><div class="big">${num(last(k)[k], d)}</div>${spark(col(k).slice(-30), opt)}</div>`;
  const rp = D.race_predictions;
  const rpTxt = rp ? Object.entries(Array.isArray(rp) ? (rp[0] || {}) : rp).filter(([k, v]) => /time/i.test(k) && typeof v === "number")
      .map(([k, v]) => `${esc(k.replace(/Time$/i, ""))}: ${Math.floor(v/3600)}:${String(Math.floor(v%3600/60)).padStart(2,"0")}:${String(Math.round(v%60)).padStart(2,"0")}`).join(" · ") : "";
  const acts = D.activities.map(a => `<tr><td>${esc((a.start || "").slice(0, 10))}</td><td>${esc(a.name)}</td><td>${esc(a.type)}</td><td>${num(a.km, 1)}</td><td>${num(a.min)}</td>
     <td>${a.pace ? Math.floor(a.pace) + ":" + String(Math.round((a.pace % 1) * 60)).padStart(2,"0") : "—"}</td><td>${num(a.hr)}</td><td>${num(a.te, 1)}</td><td>${num(a.load)}</td></tr>`).join("");
  return `<div class="grid">
   ${card("HRV (ms)", "hrv", 0, L.hrv_low != null ? { band: [L.hrv_low, L.hrv_high] } : {})}
   ${card("Sueño (h)", "sleep_h", 1)}${card("Puntuación de sueño", "sleep_score")}${card("FC en reposo", "rhr")}
   ${card("Readiness", "readiness")}${card("Body Battery máx", "bb_high")}${card("Estrés medio", "stress")}
   ${card("Carga aguda", "load_acute")}${card("Carga crónica", "load_chronic")}${card("VO2 max", "vo2max", 1)}
  </div>
  <div class="card"><h3>Km de carrera por semana</h3>${bars(D.weekly, "km")}</div>
  ${rpTxt ? `<div class="card"><h3>Predicciones de Garmin</h3>${rpTxt}</div>` : ""}
  <div class="card"><h3>Actividades recientes</h3><div style="overflow-x:auto"><table><tr><th>Día</th><th>Nombre</th><th>Tipo</th><th>km</th><th>min</th><th>min/km</th><th>FC</th><th>TE</th><th>Carga</th></tr>${acts}</table></div></div>`;
}

function registro() {
  const kinds = { coach: "Coach", nota: "Nota", import: "Importado" };
  const rows = D.log.map(l => `<tr><td>${esc(l.day || "")}</td><td>${kinds[l.kind] || esc(l.kind)}</td><td>${esc(l.text)}</td></tr>`).join("");
  return `<div class="card"><h3>Añadir nota</h3><textarea id="note"></textarea><p><button class="btn" onclick="addNote()">Guardar</button></p></div>
  <div class="card"><h3>Importar registro antiguo</h3><div class="muted">Pega aquí el log de tu otro proyecto (una entrada por línea). Se tiene en cuenta en las recomendaciones.</div>
    <textarea id="imp"></textarea><p><button class="btn" onclick="importLog()">Importar</button></p></div>
  <div class="card"><h3>Registro</h3><table><tr><th>Día</th><th>Tipo</th><th>Texto</th></tr>${rows || '<tr><td colspan=3>Vacío</td></tr>'}</table></div>`;
}

function ajustes() {
  const s = D.settings;
  return `<div class="card"><h3>Objetivo y contexto</h3>
   <label>Objetivo</label><input id="s_name" value="${esc(s.goal_name)}" style="width:100%">
   <label>Fecha del objetivo</label><input id="s_date" type="date" value="${esc(s.goal_date)}">
   <label>Días de entreno por semana / disponibilidad</label><input id="s_days" value="${esc(s.days_week)}" style="width:100%" placeholder="p. ej. 5 días, largo el domingo">
   <label>Fuente de las zonas en la pestaña Estado</label>
   <select id="s_zsrc"><option value="garmin" ${s.zonas_fuente !== "manual" ? "selected" : ""}>Garmin (FC máx estimada por Garmin)</option><option value="manual" ${s.zonas_fuente === "manual" ? "selected" : ""}>Manual (los valores de abajo)</option></select>
   <label>Zonas manuales de FC (lpm)</label>
   <div class="row"><input id="s_hrmax" value="${esc(s.hr_max)}" placeholder="FC máx" size="8"><input id="s_hrrec" value="${esc(s.hr_recovery)}" placeholder="recup. &lt;" size="8">
   <input id="s_hrlong" value="${esc(s.hr_long)}" placeholder="TL &lt;" size="8"><input id="s_hreasy" value="${esc(s.hr_easy)}" placeholder="fácil &lt;" size="8"></div>
   <label>Hitos intermedios (10K, media maratón… con fechas)</label><textarea id="s_ms" style="min-height:60px">${esc(s.milestones)}</textarea>
   <label>Contexto (tu plan, marcas, lesiones, ritmos objetivo, instrucciones del otro proyecto…)</label>
   <textarea id="s_ctx" style="min-height:260px">${esc(s.context)}</textarea>
   <label>Historial de sesiones anteriores (log en texto; solo para que el coach conozca tu evolución)</label>
   <textarea id="s_hist" style="min-height:260px">${esc(s.history)}</textarea>
   <p><button class="btn" onclick="saveSettings()">Guardar</button> <span id="saved" class="muted"></span></p></div>`;
}

async function sendWorkout() {
  if (!confirm("Esto crea el entreno en tu cuenta de Garmin Connect y lo programa hoy (se sincroniza al reloj). ¿Enviar?")) return;
  $("sendmsg").textContent = "Enviando…";
  const r = await fetch("/api/send_workout", { method: "POST" });
  const j = await r.json().catch(() => ({}));
  if (r.ok) { $("sendmsg").textContent = "Enviado: " + j.name + ". Sincroniza el reloj."; await load(); }
  else $("sendmsg").textContent = "Error: " + (j.detail || r.status);
}
async function previewWorkout() {
  const r = await fetch("/api/preview_workout"); const j = await r.json();
  alert(JSON.stringify(j, null, 1).slice(0, 3500));
}
async function addNote() {
  const t = $("note").value.trim(); if (!t) return;
  await api("/api/notes", { text: t }); await load();
}
async function importLog() {
  const t = $("imp").value.trim(); if (!t) return;
  const r = await api("/api/import_log", { text: t }); await load(); alert("Importadas " + r.lineas + " líneas");
}
async function saveSettings() {
  await api("/api/settings", { goal_name: $("s_name").value, goal_date: $("s_date").value, days_week: $("s_days").value, context: $("s_ctx").value, milestones: $("s_ms").value, hr_max: $("s_hrmax").value, hr_recovery: $("s_hrrec").value, hr_long: $("s_hrlong").value, hr_easy: $("s_hreasy").value, zonas_fuente: $("s_zsrc").value, history: $("s_hist").value });
  await load(); $("saved") && ($("saved").textContent = "Guardado");
}
load();
</script>
</body>
</html>
